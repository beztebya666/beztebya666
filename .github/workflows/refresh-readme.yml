name: refresh readme

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: node .github/scripts/update-readme.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: commit if changed
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "beztebya666"
            git config user.email "nikivinn@gmail.com"
            git commit -am "chore: refresh project list"
            git push
          fi
